<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuestionario Personalizado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Completa tu Cuestionario</h1>
    <form id="cuestionario-form">

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="datos">Edad / Sexo / Altura / Peso</label>
      <input type="text" id="datos" name="datos" placeholder="Ej: 20 años / Hombre / 1.80m / 75kg" required />

      <label for="experiencia">Nivel de experiencia</label>
      <select id="experiencia" name="experiencia" required>
        <option value="">Selecciona</option>
        <option value="principiante">Principiante</option>
        <option value="intermedio">Intermedio</option>
        <option value="avanzado">Avanzado</option>
      </select>

      <label for="objetivo">Objetivo principal</label>
      <select id="objetivo" name="objetivo" required>
        <option value="">Selecciona</option>
        <option value="perder_grasa">Perder grasa</option>
        <option value="ganar_musculo">Ganar músculo</option>
        <option value="mantener">Mantener</option>
      </select>

      <label for="dias">Días disponibles por semana</label>
      <input type="number" id="dias" name="dias" min="1" max="7" required />

      <label for="tiempo">Tiempo por día</label>
      <select id="tiempo" name="tiempo" required>
        <option value="">Selecciona</option>
        <option value="30min">30 min</option>
        <option value="45min">45 min</option>
        <option value="1h">1 hora</option>
      </select>

      <label for="material">Acceso a material</label>
      <select id="material" name="material" required>
        <option value="">Selecciona</option>
        <option value="casa">Casa</option>
        <option value="gimnasio">Gimnasio</option>
        <option value="mixto">Mixto</option>
      </select>

      <label for="restricciones">Restricciones alimentarias</label>
      <input type="text" id="restricciones" name="restricciones" placeholder="Ej: Sin gluten, vegano..." />

      <label for="salud">Problemas de salud o lesiones</label>
      <textarea id="salud" name="salud" rows="3" placeholder="Describe si hay algo relevante"></textarea>

      <label for="preferencias">Preferencias (cardio, fuerza, movilidad)</label>
      <input type="text" id="preferencias" name="preferencias" />

      <label for="comidas">¿Qué comidas haces normalmente? (2, 3, 5...)</label>
      <input type="text" id="comidas" name="comidas" required />

      <button type="submit">Enviar cuestionario</button>
    </form>
  </div>
</body>
</html>
